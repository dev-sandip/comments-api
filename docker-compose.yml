
services:
  postgres:
    image: postgres:16-alpine
    container_name: comments_postgres
    restart: no

    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - comments_api_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  comments_api_postgres_data:
